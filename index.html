<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Biblioteca</title>

<link rel="apple-touch-icon" sizes="180x180" href="https://cdn-icons-png.flaticon.com/512/2232/2232688.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Biblioteca">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(180deg,#f3efe7,#fafafa);
  color:#1f2933;
}

.app{
  max-width:900px;
  margin:0 auto;
  padding:22px;
}

.header{
  background:#1f2933;
  color:white;
  padding:24px;
  border-radius:24px;
  margin-bottom:18px;
  box-shadow:0 8px 24px rgba(0,0,0,.16);
}

.header h1{
  margin:0;
  font-size:30px;
}

.header p{
  margin:8px 0 0;
  opacity:.85;
}

.panel{
  background:white;
  border-radius:22px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
}

input,select,button{
  width:100%;
  padding:13px;
  margin-top:10px;
  border-radius:14px;
  border:1px solid #d0d7de;
  font-size:16px;
}

button,.button{
  display:inline-block;
  background:#10a37f;
  color:white;
  border:none;
  text-decoration:none;
  text-align:center;
  font-weight:700;
  cursor:pointer;
}

.book{
  background:white;
  border-radius:20px;
  padding:16px;
  margin-top:14px;
  box-shadow:0 3px 14px rgba(0,0,0,.08);
}

.book h3{
  margin:0 0 6px;
  font-size:19px;
}

.small{
  color:#6b7280;
  font-size:14px;
  margin-top:4px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.stat{
  background:#f8fafc;
  border-radius:16px;
  padding:14px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:24px;
}

@media(min-width:700px){
  .stats{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>📚 Mi biblioteca</h1>
  <div class="muted">Importa tu CSV de Goodreads, busca, filtra y abre ChatGPT con un prompt de resumen para cada libro.</div>

  <div class="card">
    <h2>1. Importar CSV</h2>
    <input id="file" type="file" accept=".csv,text/csv">
    <div id="status" class="status">Elige tu archivo <b>goodreads_library_export.csv</b>.</div>
  </div>

  <div class="card">
    <h2>2. Buscar y filtrar</h2>
    <div class="grid">
      <input id="q" placeholder="Buscar título, autor, editorial...">
      <select id="rating"><option value="">Todas las notas</option><option value="5">5 estrellas</option><option value="4">4 estrellas</option><option value="3">3 estrellas</option><option value="2">2 estrellas</option><option value="1">1 estrella</option><option value="0">Sin valorar</option></select>
      <select id="shelf"><option value="">Todas las estanterías</option></select>
      <select id="sort"><option value="date">Fecha leído</option><option value="rating">Nota</option><option value="title">Título</option><option value="author">Autor</option></select>
    </div>
  </div>

  <div class="card stats" id="stats"></div>
  <div class="card"><h2>Libros</h2><div id="results" class="muted">Aún no hay libros cargados.</div></div>
</div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  let books = [];

  function parseCSV(text){
    text = text.replace(/^\uFEFF/, '');
    const rows=[]; let row=[], field='', quote=false;
    for(let i=0;i<text.length;i++){
      const c=text[i], n=text[i+1];
      if(quote){
        if(c==='"' && n==='"'){ field+='"'; i++; }
        else if(c==='"'){ quote=false; }
        else { field+=c; }
      } else {
        if(c==='"') quote=true;
        else if(c===','){ row.push(field); field=''; }
        else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
        else if(c==='\r'){}
        else field+=c;
      }
    }
    row.push(field); rows.push(row);
    const headers = rows.shift().map(h=>h.trim());
    return rows.filter(r=>r.some(x=>String(x||'').trim())).map(r=>{
      const o={}; headers.forEach((h,i)=>o[h]=(r[i]||'').trim()); return o;
    });
  }

  function val(b, names){ for(const n of names){ if(b[n]!==undefined && b[n]!==null && String(b[n]).trim()!=='') return String(b[n]).trim(); } return ''; }
  function rating(b){ return parseInt(val(b,['My Rating','My rating','Rating'])) || 0; }
  function title(b){ return val(b,['Title']); }
  function author(b){ return val(b,['Author','Author l-f','Additional Authors']); }
  function shelves(b){ return val(b,['Bookshelves','Exclusive Shelf']); }
  function dateRead(b){ return val(b,['Date Read','Date read']); }
  function pages(b){ return val(b,['Number of Pages','Number of pages']); }
  function publisher(b){ return val(b,['Publisher']); }
  function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
  function stars(n){ return n ? '★'.repeat(n)+'☆'.repeat(5-n) : 'Sin valorar'; }

  function chatUrl(b){
    const prompt = `Hazme un resumen claro y útil del libro "${title(b)}" de ${author(b)}. Incluye: 1) de qué va, 2) temas principales, 3) estilo literario, 4) contexto del autor, 5) por qué podría gustarme según mi perfil lector: literatura histórica, decadencia de civilizaciones, ética, tecnología, poder e individuo. Evita spoilers importantes salvo que avises.`;
    return 'https://chat.openai.com/?q=' + encodeURIComponent(prompt);
  }

  function refreshShelves(){
    const sel=$('shelf'); const current=sel.value;
    const set=new Set(); books.forEach(b=>shelves(b).split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>set.add(x)));
    sel.innerHTML='<option value="">Todas las estanterías</option>'+Array.from(set).sort().map(x=>`<option value="${escapeHtml(x)}">${escapeHtml(x)}</option>`).join('');
    sel.value=current;
  }

  function filtered(){
    const q=$('q').value.toLowerCase().trim(), r=$('rating').value, sh=$('shelf').value;
    let arr=books.filter(b=>{
      const text=[title(b),author(b),publisher(b),shelves(b)].join(' ').toLowerCase();
      return (!q || text.includes(q)) && (!r || String(rating(b))===r) && (!sh || shelves(b).includes(sh));
    });
    const sort=$('sort').value;
    arr.sort((a,b)=>{
      if(sort==='rating') return rating(b)-rating(a) || title(a).localeCompare(title(b));
      if(sort==='title') return title(a).localeCompare(title(b));
      if(sort==='author') return author(a).localeCompare(author(b));
      return (dateRead(b)||'').localeCompare(dateRead(a)||'');
    });
    return arr;
  }

  function render(){
    const arr=filtered();
    const read=books.filter(b=>shelves(b).includes('read') || val(b,['Exclusive Shelf'])==='read').length;
    const avg=books.filter(b=>rating(b)>0).reduce((a,b)=>a+rating(b),0) / Math.max(1, books.filter(b=>rating(b)>0).length);
    $('stats').innerHTML=`<div class="stat"><b>${books.length}</b><span>Total</span></div><div class="stat"><b>${read}</b><span>Leídos</span></div><div class="stat"><b>${avg.toFixed(2)}</b><span>Nota media</span></div><div class="stat"><b>${arr.length}</b><span>Resultado</span></div>`;
    if(!books.length){ $('results').innerHTML='Aún no hay libros cargados.'; return; }
    if(!arr.length){ $('results').innerHTML='No hay resultados con esos filtros.'; return; }
    $('results').innerHTML=arr.slice(0,120).map(b=>`<div class="book"><div class="title">${escapeHtml(title(b))}</div><div class="meta">${escapeHtml(author(b))} ${publisher(b)?' · '+escapeHtml(publisher(b)):''} ${pages(b)?' · '+escapeHtml(pages(b))+' págs.':''}</div><div class="row"><span class="stars">${stars(rating(b))}</span>${dateRead(b)?`<span class="pill">Leído: ${escapeHtml(dateRead(b))}</span>`:''}${shelves(b)?`<span class="pill">${escapeHtml(shelves(b))}</span>`:''}</div><div style="margin-top:10px"><a class="btn" target="_blank" rel="noopener" href="${chatUrl(b)}">✨ Resumir con ChatGPT</a></div></div>`).join('') + (arr.length>120?`<div class="muted">Mostrando 120 de ${arr.length}. Afina la búsqueda.</div>`:'');
  }

  $('file').addEventListener('change', e=>{
    const f=e.target.files && e.target.files[0]; if(!f) return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        books=parseCSV(String(reader.result||''));
        if(!books.length) throw new Error('No se encontraron filas en el CSV.');
        localStorage.setItem('goodreads_csv', String(reader.result||''));
        $('status').innerHTML=`✅ CSV cargado: <b>${escapeHtml(f.name)}</b>. Libros detectados: <b>${books.length}</b>.`;
        refreshShelves(); render();
      }catch(err){ $('status').innerHTML='❌ Error leyendo CSV: '+escapeHtml(err.message); }
    };
    reader.onerror=()=>{$('status').innerHTML='❌ No he podido leer el archivo.'};
    reader.readAsText(f, 'UTF-8');
  });
  ['q','rating','shelf','sort'].forEach(id=>$(id).addEventListener('input', render));
  try{ const saved=localStorage.getItem('goodreads_csv'); if(saved){ books=parseCSV(saved); $('status').innerHTML=`✅ CSV recuperado del iPhone. Libros: <b>${books.length}</b>.`; refreshShelves(); render(); } }catch(e){}
  render();
})();
</script>
</body>
</html>
